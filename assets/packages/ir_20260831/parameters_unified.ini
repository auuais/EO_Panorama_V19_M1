;==============================================================================
; V17 Unified Configuration (EO + IR + Mode Select)
;==============================================================================

[output]
; Mode IDs (hex):
; 0x00 blackout
; 0x01 EO panorama + stabilization
; 0x02 IR panorama + stabilization
; 0x03 EO panorama (no stabilization)
; 0x06 IR panorama (no stabilization)
; 0x07-0x0C EO undistorted cam 1-6
; 0x0D-0x12 IR undistorted cam 1-6
; 0x13 status indication
mode = 0x01

[debug]
num_frames = 6
save_every_k = 1

;==============================================================================
; EO CAMERA (1920x1080)
;==============================================================================
[eo_camera]
width = 1920
height = 1080
num_cams = 6

fx = 1141.834740
fy = 1142.434960
cx_ratio = 0.489836
cy_ratio = 0.514300

fx_dist = 1141.834740
fy_dist = 1142.434960
cx_dist = 940.486
cy_dist = 555.444

k1 = -0.163318
k2 = 0.165940
k3 = -0.064582
p1 = 0.000236
p2 = 0.000773

;resize_factor = 0.5416667
